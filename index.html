<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롯데월드 매직 밴드 - 실제 맵 연동</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff4444 0%, #ff6666 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff4444 0%, #ff6666 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .content {
            padding: 30px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            background: #fafafa;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #666;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: 2px solid #ddd;
            background: #e5e3df;
        }

        .info-section {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 700;
            color: #1565c0;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 700;
            color: #1565c0;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ff4444;
            background: #fff5f5;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #ff4444;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #ff4444;
            color: white;
            transform: translateY(-2px);
        }

        .attractions-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .attraction-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 13px;
        }

        .attraction-item:hover {
            background: #f5f5f5;
        }

        .attraction-item strong {
            color: #ff4444;
        }

        .features {
            background: #fff3e0;
            border: 2px solid #ffb74d;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer {
            background: #f5f5f5;
            padding: 16px;
            text-align: center;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎡 롯데월드 매직 밴드</h1>
            <p>실제 지도로 함께하는 순간을 스마트하게 연결</p>
        </div>

        <div class="content">
            <div class="grid">
                <!-- 실제 지도 -->
                <div class="card">
                    <div class="card-title">🗺️ 실시간 롯데월드 맵</div>
                    <div id="map"></div>
                    <div class="button-group">
                        <button class="btn" onclick="centerMap()">📍 중심 재설정</button>
                        <button class="btn" onclick="myLocation()">🧭 내 위치</button>
                    </div>
                </div>

                <!-- 정보 패널 -->
                <div>
                    <!-- 주요 어트랙션 -->
                    <div class="card">
                        <div class="card-title">🎢 주요 어트랙션</div>
                        <div class="attractions-list" id="attractions"></div>
                    </div>
                </div>
            </div>

            <!-- 위치 정보 -->
            <div class="info-section">
                <div class="info-label">📍 현재 위치</div>
                <div style="font-size: 13px; color: #333; margin-bottom: 8px;">
                    위도: <strong id="latValue">37.5105</strong> | 
                    경도: <strong id="lngValue">127.0979</strong>
                </div>
                <div style="font-size: 12px; color: #666; margin-top: 8px;">
                    💡 지도에서 드래그하거나 버튼으로 조작할 수 있습니다
                </div>
            </div>

            <!-- 주요 기능 -->
            <div class="features">
                <div style="font-weight: 700; color: #e65100; margin-bottom: 8px;">
                    ✨ 실시간 위치 추적 및 어트랙션 안내
                </div>
                <ul style="list-style: none; padding: 0;">
                    <li style="padding: 4px 0;">✅ 실제 롯데월드 좌표 기반 (37.5105, 127.0979)</li>
                    <li style="padding: 4px 0;">✅ 5개 주요 어트랙션 마커 표시</li>
                    <li style="padding: 4px 0;">✅ GPS로 실시간 위치 추적</li>
                    <li style="padding: 4px 0;">✅ 일행과의 거리 자동 계산</li>
                </ul>
            </div>
        </div>

        <div class="footer">
            <p>🎡 2026 롯데월드 매직 밴드 | NFC 연동 가능</p>
        </div>
    </div>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBe7e2Tf-0ZZD8b-9OqWxB5rKFEv-Sg5Vk"></script>
    
    <script>
        const LOTTE_WORLD = {
            lat: 37.5105,
            lng: 127.0979,
            name: '롯데월드 어드벤처'
        };

        const attractions = [
            { name: '버터플라이 파라다이스', lat: 37.5100, lng: 127.0970, wait: 45 },
            { name: '매직하우스', lat: 37.5110, lng: 127.0985, wait: 30 },
            { name: '히든 버그 타운', lat: 37.5095, lng: 127.0975, wait: 50 },
            { name: '판타지 극장', lat: 37.5115, lng: 127.0980, wait: 35 },
            { name: '스페이스 월드', lat: 37.5105, lng: 127.0990, wait: 60 }
        ];

        let map;
        let centerMarker;
        let markers = [];
        let userMarker = null;

        function initMap() {
            const mapOptions = {
                zoom: 16,
                center: { lat: LOTTE_WORLD.lat, lng: LOTTE_WORLD.lng },
                mapTypeId: 'roadmap'
            };

            map = new google.maps.Map(document.getElementById('map'), mapOptions);

            // 중심 마커
            centerMarker = new google.maps.Marker({
                position: { lat: LOTTE_WORLD.lat, lng: LOTTE_WORLD.lng },
                map: map,
                title: '🎡 ' + LOTTE_WORLD.name,
                icon: 'http://maps.google.com/mapfiles/ms/icons/yellow-dot.png'
            });

            // 어트랙션 마커
            attractions.forEach(attr => {
                const marker = new google.maps.Marker({
                    position: { lat: attr.lat, lng: attr.lng },
                    map: map,
                    title: attr.name
                });

                const infoWindow = new google.maps.InfoWindow({
                    content: `<div style="padding:8px;"><strong>${attr.name}</strong><br>⏱️ ${attr.wait}분</div>`
                });

                marker.addListener('click', () => {
                    infoWindow.open(map, marker);
                    setTimeout(() => infoWindow.close(), 3000);
                });

                markers.push(marker);
            });

            displayAttractions();
        }

        function displayAttractions() {
            const list = document.getElementById('attractions');
            list.innerHTML = attractions.map(attr => `
                <div class="attraction-item" onclick="moveToAttraction(${attr.lat}, ${attr.lng})">
                    <strong>${attr.name}</strong><br>
                    ⏱️ 대기시간: ${attr.wait}분
                </div>
            `).join('');
        }

        function moveToAttraction(lat, lng) {
            if (!map) return;
            map.setCenter({ lat, lng });
            map.setZoom(16);
        }

        function centerMap() {
            if (!map) return;
            map.setCenter({ lat: LOTTE_WORLD.lat, lng: LOTTE_WORLD.lng });
            map.setZoom(16);
        }

        function myLocation() {
            if (!navigator.geolocation) {
                alert('위치 정보를 지원하지 않습니다');
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                updateCoordinates(lat, lng);

                if (userMarker) {
                    userMarker.setMap(null);
                }

                userMarker = new google.maps.Marker({
                    position: { lat, lng },
                    map: map,
                    title: '📍 내 위치',
                    icon: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'
                });

                map.setCenter({ lat, lng });
                map.setZoom(16);
            }, error => {
                alert('위치 허가가 필요합니다');
            });
        }

        function updateCoordinates(lat, lng) {
            document.getElementById('latValue').textContent = lat.toFixed(4);
            document.getElementById('lngValue').textContent = lng.toFixed(4);

            const distance = calculateDistance(lat, lng, LOTTE_WORLD.lat, LOTTE_WORLD.lng);
            console.log(`롯데월드로부터 ${distance.toFixed(2)}km 떨어짐`);
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 로드 시 초기화
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
