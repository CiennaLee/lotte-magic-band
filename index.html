<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롯데월드 매직 밴드 - 실제 맵 연동</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff4444 0%, #ff6666 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff4444 0%, #ff6666 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .content {
            padding: 30px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            background: #fafafa;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #666;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .info-section {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 700;
            color: #1565c0;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ff4444;
            background: #fff5f5;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #ff4444;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #ff4444;
            color: white;
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            flex: none;
        }

        .btn-danger {
            border-color: #d32f2f;
            color: #d32f2f;
            background: #ffebee;
        }

        .btn-danger:hover {
            background: #d32f2f;
            color: white;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff4444;
            background: #fff5f5;
        }

        .members-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .member-item {
            background: white;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }

        .member-distance {
            font-size: 12px;
            color: #1565c0;
            margin-top: 4px;
        }

        .member-item button {
            background: none;
            border: none;
            color: #d32f2f;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        .member-item button:hover {
            transform: scale(1.2);
        }

        .features {
            background: #fff3e0;
            border: 2px solid #ffb74d;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer {
            background: #f5f5f5;
            padding: 16px;
            text-align: center;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #666;
        }

        .my-location-info {
            background: #f0f8ff;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ff4444;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .my-location-info strong {
            color: #ff4444;
        }

        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #856404;
        }

        .success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎡 롯데월드 매직 밴드</h1>
            <p>실시간 일행 위치 추적 및 어트랙션 안내</p>
        </div>

        <div class="content">
            <div id="alert"></div>

            <div class="grid">
                <!-- 실제 지도 -->
                <div class="card">
                    <div class="card-title">🗺️ 실시간 롯데월드 맵</div>
                    <div id="map"></div>
                    <div class="button-group">
                        <button class="btn" onclick="centerMap()">📍 중심</button>
                        <button class="btn" onclick="updateMyLocation()">🧭 내 위치</button>
                        <button class="btn" onclick="toggleAutoUpdate()">🔄 자동 <span id="autoStatus">OFF</span></button>
                    </div>
                </div>

                <!-- 일행 관리 패널 -->
                <div>
                    <!-- 내 위치 정보 -->
                    <div class="card">
                        <div class="card-title">📍 내 위치</div>
                        <div class="my-location-info">
                            위도: <strong id="myLat">37.5105</strong><br>
                            경도: <strong id="myLng">127.0979</strong>
                        </div>

                        <!-- 일행 추가 -->
                        <div class="card-title" style="margin-top: 16px;">➕ 일행 추가</div>
                        <div class="form-group">
                            <label>일행 이름</label>
                            <input type="text" id="memberName" placeholder="예: 엄마, 친구1" />
                        </div>
                        <button class="btn" onclick="addMember()">추가하기</button>

                        <!-- 일행 목록 -->
                        <div class="card-title" style="margin-top: 16px;">👥 일행 목록 (<span id="memberCount">0</span>)</div>
                        <div class="members-list" id="membersList"></div>
                    </div>
                </div>
            </div>

            <!-- 주요 기능 -->
            <div class="features">
                <div style="font-weight: 700; color: #e65100; margin-bottom: 8px;">
                    ✨ 실시간 일행 위치 추적
                </div>
                <ul style="list-style: none; padding: 0;">
                    <li style="padding: 4px 0;">✅ 일행을 등록하고 실시간 위치 확인</li>
                    <li style="padding: 4px 0;">✅ 내 위치 기반으로 일행과의 거리 자동 계산</li>
                    <li style="padding: 4px 0;">✅ 자동 위치 업데이트 (위치 공유 설정)</li>
                    <li style="padding: 4px 0;">✅ 어트랙션 정보 및 대기시간 안내</li>
                </ul>
            </div>
        </div>

        <div class="footer">
            <p>🎡 2026 롯데월드 매직 밴드 | 실시간 일행 추적 | Powered by OpenStreetMap</p>
        </div>
    </div>

    <!-- Leaflet 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <script>
        const LOTTE_WORLD = {
            lat: 37.5105,
            lng: 127.0979,
            name: '롯데월드 어드벤처'
        };

        const attractions = [
            { name: '버터플라이 파라다이스', lat: 37.5100, lng: 127.0970, wait: 45 },
            { name: '매직하우스', lat: 37.5110, lng: 127.0985, wait: 30 },
            { name: '히든 버그 타운', lat: 37.5095, lng: 127.0975, wait: 50 },
            { name: '판타지 극장', lat: 37.5115, lng: 127.0980, wait: 35 },
            { name: '스페이스 월드', lat: 37.5105, lng: 127.0990, wait: 60 }
        ];

        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8'];
        let map;
        let myMarker;
        let memberMarkers = {};
        let members = {};
        let myLocation = { lat: LOTTE_WORLD.lat, lng: LOTTE_WORLD.lng };
        let autoUpdateInterval = null;

        function initMap() {
            map = L.map('map').setView([LOTTE_WORLD.lat, LOTTE_WORLD.lng], 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            // 롯데월드 중심점
            L.marker([LOTTE_WORLD.lat, LOTTE_WORLD.lng], {
                title: '🎡 ' + LOTTE_WORLD.name
            }).addTo(map)
            .bindPopup(`<strong>🎡 ${LOTTE_WORLD.name}</strong>`);

            // 내 위치 마커
            myMarker = L.circleMarker([myLocation.lat, myLocation.lng], {
                radius: 12,
                fillColor: '#ff4444',
                color: '#fff',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map)
            .bindPopup('<strong>📍 내 위치</strong>');

            loadMembers();
        }

        function updateMyLocation() {
            if (!navigator.geolocation) {
                showAlert('위치 정보를 지원하지 않습니다', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                myLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                document.getElementById('myLat').textContent = myLocation.lat.toFixed(4);
                document.getElementById('myLng').textContent = myLocation.lng.toFixed(4);

                myMarker.setLatLng([myLocation.lat, myLocation.lng]);
                map.setView([myLocation.lat, myLocation.lng], 16);

                updateAllDistances();
                showAlert('✅ 내 위치를 업데이트했습니다', 'success');
            }, error => {
                showAlert('❌ 위치 허가가 필요합니다', 'error');
            });
        }

        function addMember() {
            const name = document.getElementById('memberName').value.trim();
            
            if (!name) {
                showAlert('일행의 이름을 입력하세요', 'error');
                return;
            }

            if (members[name]) {
                showAlert('이미 등록된 일행입니다', 'error');
                return;
            }

            // GPS로 일행 위치 수집
            if (!navigator.geolocation) {
                showAlert('위치 정보를 지원하지 않습니다', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const id = Date.now().toString();
                const colorIdx = Object.keys(members).length % colors.length;
                
                members[name] = {
                    id: id,
                    lat: position.coords.latitude,
                    lng: position.coords.longitude,
                    color: colors[colorIdx]
                };

                saveMembers();
                displayMembers();
                addMemberMarker(name);
                
                document.getElementById('memberName').value = '';
                showAlert(`✅ ${name}을(를) 추가했습니다`, 'success');
            }, error => {
                showAlert('❌ 위치 허가가 필요합니다', 'error');
            });
        }

        function addMemberMarker(name) {
            const member = members[name];
            
            const marker = L.circleMarker([member.lat, member.lng], {
                radius: 10,
                fillColor: member.color,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map)
            .bindPopup(`<strong>${name}</strong>`);

            memberMarkers[name] = marker;
        }

        function removeMember(name) {
            if (confirm(`${name}을(를) 삭제하시겠습니까?`)) {
                delete members[name];
                
                if (memberMarkers[name]) {
                    map.removeLayer(memberMarkers[name]);
                    delete memberMarkers[name];
                }

                saveMembers();
                displayMembers();
                showAlert(`✅ ${name}을(를) 삭제했습니다`, 'success');
            }
        }

        function displayMembers() {
            const list = document.getElementById('membersList');
            const count = document.getElementById('memberCount');
            
            count.textContent = Object.keys(members).length;

            if (Object.keys(members).length === 0) {
                list.innerHTML = '<p style="color: #999; font-size: 12px; padding: 12px;">등록된 일행이 없습니다</p>';
                return;
            }

            list.innerHTML = Object.entries(members).map(([name, data]) => {
                const distance = calculateDistance(myLocation.lat, myLocation.lng, data.lat, data.lng);
                
                return `
                    <div class="member-item">
                        <div class="member-info">
                            <div class="member-name" style="color: ${data.color};">● ${name}</div>
                            <div class="member-distance">거리: ${distance.toFixed(2)}km</div>
                        </div>
                        <button onclick="removeMember('${name}')" title="삭제">✕</button>
                    </div>
                `;
            }).join('');
        }

        function updateAllDistances() {
            displayMembers();
        }

        function saveMembers() {
            localStorage.setItem('members', JSON.stringify(members));
        }

        function loadMembers() {
            const saved = localStorage.getItem('members');
            if (saved) {
                members = JSON.parse(saved);
                displayMembers();
                
                // 기존 마커들 추가
                Object.keys(members).forEach(name => {
                    addMemberMarker(name);
                });
            }
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function centerMap() {
            map.setView([myLocation.lat, myLocation.lng], 16);
        }

        function toggleAutoUpdate() {
            const btn = document.getElementById('autoStatus').parentElement;
            const status = document.getElementById('autoStatus');

            if (autoUpdateInterval) {
                clearInterval(autoUpdateInterval);
                autoUpdateInterval = null;
                status.textContent = 'OFF';
                status.parentElement.style.background = '#fff5f5';
                showAlert('자동 위치 업데이트를 중지했습니다', 'success');
            } else {
                autoUpdateInterval = setInterval(updateMyLocation, 10000); // 10초마다
                status.textContent = 'ON';
                status.parentElement.style.background = '#d4edda';
                updateMyLocation();
                showAlert('✅ 자동 위치 업데이트를 시작했습니다 (10초 간격)', 'success');
            }
        }

        function showAlert(msg, type = 'info') {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert ${type}">${msg}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 3000);
        }

        // 로드 시 초기화
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
